name: Vault CI

on:
  push:
    branches: [main, vault-production-upgrade, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    env:
      # Placeholder PostgreSQL URL required by prisma.config.ts for client generation.
      # Prisma generate performs code generation only and does not establish a database connection.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vault_ci_dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

  test-and-build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@localhost:5432/vault
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: vault
      MINIO_BUCKET: vault
      MINIO_USE_SSL: "false"
      JWT_SECRET: test-secret-key-for-vault-ci-2026-long-enough
      APP_URL: http://localhost:5000
      RATE_LIMIT_TEST: "false"
      EMAIL_FROM: noreply@vault.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Verify MinIO readiness and initialize bucket
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:9000/minio/health/ready; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO to be ready..."
            sleep 1
          done
          node -e "const { minioClient, BUCKET_NAME } = require('./dist/config/minio.js'); minioClient.bucketExists(BUCKET_NAME).then(exists => exists ? null : minioClient.makeBucket(BUCKET_NAME, 'us-east-1')).then(() => console.log('MinIO bucket verified/created: ' + BUCKET_NAME)).catch(err => { console.error('Failed to initialize MinIO bucket:', err); process.exit(1); });"

      - name: Run tests
        run: npm test
