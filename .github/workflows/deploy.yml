name: Vault CD

on:
  workflow_run:
    workflows: ["Vault CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd ~/vault

            cp .env.docker /tmp/vault.env.docker

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/vault.env.docker .env.docker

                        docker compose --env-file .env.docker build vault-api
                        docker compose --env-file .env.docker up -d vault-api vault-worker

            sleep 20

            docker compose ps

                        curl -fsS http://localhost:5000/api/v1/health/ready
