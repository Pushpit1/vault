name: Vault CD

on:
  workflow_run:
    workflows: ["Vault CI"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd ~/vault

            cp .env.docker /tmp/vault.env.docker

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/vault.env.docker .env.docker

            docker compose --env-file .env.docker build vault-api
            docker compose --env-file .env.docker up -d vault-api vault-worker

            for i in {1..12}; do
              if curl -fsS http://localhost:5000/api/v1/health/ready; then
                echo
                echo "API readiness check passed"
                exit 0
              fi

              echo "API not ready yet... attempt $i/12"
              sleep 5
            done

            echo "API failed to become ready"
            docker compose ps
            docker logs vault-api --tail 100
            exit 1
