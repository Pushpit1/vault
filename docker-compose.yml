services:
  postgres:
    image: postgres:17

    container_name: vault-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault123
      POSTGRES_DB: vault

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: