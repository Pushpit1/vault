services:
  vault-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: vault-api:latest
    container_name: vault-api

    env_file:
      - .env.docker

    command: npm start

    ports:
      - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vault-worker:
    image: vault-api:latest
    container_name: vault-worker

    env_file:
      - .env.docker

    command: npm run worker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: vault-postgres

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vault"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vault

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vault-redis

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - "6379"

    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: vault-minio

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data: